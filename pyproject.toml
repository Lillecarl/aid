[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aid"
version = "0.1.0"
description = "AI daemon: persistent ACP and pydantic-ai agents behind a Pythonic async API."
requires-python = ">=3.14"
dependencies = [
  "agent-client-protocol>=0.12",
  "anyio>=4.10",
  "authlib>=1.6",
  "httpx>=0.28",
  "hypercorn>=0.17",
  "itsdangerous>=2.2",
  "libpymux",
  "mcp>=1.20",
  "numpy>=2.0",
  # The SDK behind pydantic-ai's OpenAI-compatible providers: OpenAI itself, DeepSeek, OpenRouter and the like.
  "openai>=2.0",
  "pydantic>=2.11",
  "pydantic-ai-slim>=2.30",
  # aid web's colours: pymux's theme roles, and the catppuccin styles a pymux theme can name.
  "pymux[catppuccin]",
  "pyzmq>=27",
  # aid web's speech to text. onnxruntime comes with it; nothing imports it outside aid.speech.
  "sherpa-onnx>=1.12",
  "starlette>=1.0",
  # aid web's highlighter. The grammars come from AID_TREE_SITTER_GRAMMARS (nix/tree-sitter-grammars.nix).
  "tree-sitter>=0.25",
  "watchfiles>=1.0",
]

[project.optional-dependencies]
test = ["pytest", "trustme", "websockets"]

[project.scripts]
aid = "aid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "TC", "TID", "ASYNC", "PTH", "RET", "FA", "PGH", "PLC0415"]
ignore = ["E501"]
# Claude Code draws its prompt with it; matching the screen needs the real character.
allowed-confusables = ["❯"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "Use anyio. The acp library is asyncio-native; keep that seam inside the acp package."
"subprocess".msg = "Use anyio.open_process or acp.spawn_agent_process."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "aid.protocol._Message", "aid.spec._Spec"]

[tool.ruff.lint.isort]
known-first-party = ["aid"]
