[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aid"
version = "0.1.0"
description = "AI daemon: persistent ACP and native agents behind a Pythonic async API."
requires-python = ">=3.14"
dependencies = [
  "agent-client-protocol>=0.12",
  "anyio>=4.10",
  # Removal plans and supervisor rulings, which supervisors query in SQL; nix/apsw.nix.
  "apsw>=3.54",
  "authlib>=1.6",
  "httpx>=0.28",
  "hypercorn>=0.17",
  "itsdangerous>=2.2",
  "libpymux",
  "mcp>=1.20",
  "numpy>=2.0",
  # aid.model: the native backend's transports, built from pins in default.nix.
  "anthropic",
  "google-genai",
  "openai",
  "pydantic>=2.11",
  # aid.coding: agents edit through pyedit's library and run processes through pyrun (./pyrun).
  "pyedit",
  "pyrun",
  # aid.coding: background tasks run through shellous, in the worker.
  "shellous",
  # aid.coding: the xonsh mode of the python tool runs `python -m xonsh`.
  "xonsh",
  # aid web's colours: pymux's theme roles, and the catppuccin styles a pymux theme can name.
  "pymux[catppuccin]",
  "pyzmq>=27",
  # aid web's speech to text. onnxruntime comes with it; nothing imports it outside aid.speech.
  "sherpa-onnx>=1.12",
  "starlette>=1.0",
  "structlog>=24.4",
  # The Discord plugin's gateway: wsproto frames the wire with no event loop of its own, driven over
  # anyio streams. (Transitively present via httpx already; declared because the plugin imports it.)
  "wsproto>=1.2",
  # aid web's highlighter. The grammars come from AID_TREE_SITTER_GRAMMARS (nix/tree-sitter-grammars.nix).
  "tree-sitter>=0.25",
  # Its lexers highlight what no grammar knows; theme.py takes its styles. (Present via rich too.)
  "pygments>=2.19",
  "watchfiles>=1.0",
  # The skills plugin: SKILL.md frontmatter is YAML (Agent Skills).
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# playwright drives the web UI through real browsers in tests/test_browser.py; the browsers themselves come
# from nixpkgs (PLAYWRIGHT_BROWSERS_PATH), never from a download.
test = ["playwright", "pytest", "pytest-xdist", "trustme", "websockets"]

[project.scripts]
aid = "aid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# xonsh (a dependency, for the python tool's xonsh mode) registers a pytest plugin that builds its parser tables
# in a background thread at startup: ~2.7 s holding the GIL in every pytest process, enough to starve tests with
# short deadlines. Nothing here collects xonsh tests.
addopts = "--dist loadgroup -p no:xonsh"
filterwarnings = [
  "error",
  # google-genai's types module uses typing._UnionGenericAlias at import (googleapis/python-genai#1640).
  "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "plugins"]
exclude = ["tests/vivarium"]

[tool.ruff]
target-version = "py314"
line-length = 120
# Vivarium phase scripts: mkTest type-checks them against vivarium_runner itself, which aid's shell
# does not carry.
exclude = ["tests/vivarium"]

[tool.ruff.lint]
# Future annotations everywhere (Lillecarl/aid#26): FA100 needs the import wherever `|` appears,
# UP037 bans quoted annotations. No ruff rule requires the import unconditionally, so
# tests/test_style.py requires it on every file instead.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "TC", "TID", "ASYNC", "PTH", "RET", "FA", "PGH", "PLC0415"]
# TC006 requires quotes in `cast("T", ...)` so the name can stay a TYPE_CHECKING import. The ban covers
# casts too, so the names are runtime imports instead; tests/test_style.py enforces the cast half.
ignore = ["E501", "TC006"]
# Claude Code draws its prompt with it; matching the screen needs the real character.
allowed-confusables = ["❯"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "Use anyio. The acp library is asyncio-native; keep that seam inside the acp package."
"subprocess".msg = "Use anyio.open_process or acp.spawn_agent_process."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "aid.protocol._Message", "aid.spec._Spec"]
# Tool reads a tool's hints with get_type_hints, the return annotation included.
runtime-evaluated-decorators = ["aid.tools.mcptool"]

[tool.ruff.lint.isort]
known-first-party = ["aid", "pyrun"]
