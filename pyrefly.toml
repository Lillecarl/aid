# Bare `pyrefly check` runs in project mode: these includes select the files, the excludes drop the
# vivarium scripts (they belong to the guest toolchain, as in the ruff and pyright excludes). Imports
# resolve from src/ (the aid package), the root (the tests package, as at runtime under pytest, and
# in-tree plugins as plugins.<name>).
project-includes = ["src", "tests", "plugins"]
# The Ghidra helper runs on pyghidra's own Python, as pyproject.toml's pyright exclude says.
project-excludes = ["tests/vivarium/**", "plugins/reverse/ghidra_helper.py"]
search-path = ["src", "."]
