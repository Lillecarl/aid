[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrun"
version = "0.1.0"
description = "Run processes from async Python: commands as values, scopes that kill what they started, a record per process."
requires-python = ">=3.14"
dependencies = ["anyio>=4.10"]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "TC", "TID", "ASYNC", "PTH", "RET", "FA", "PGH", "PLC0415"]
ignore = ["E501"]

# subprocess is not banned: pyrun takes its constants. Processes start through anyio.open_process only.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "Use anyio."

[tool.ruff.lint.isort]
known-first-party = ["pyrun"]
